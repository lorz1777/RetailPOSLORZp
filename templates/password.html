{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<form method="post" class="card stack">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <h1>Change password</h1>
  <label>Current password
    <input type="password" name="current" autocomplete="current-password" required autofocus>
  </label>
  <label>New password <span class="muted">(at least 8 characters)</span>
    <input type="password" name="new" autocomplete="new-password" minlength="8" required>
  </label>
  <label>Repeat new password
    <input type="password" name="confirm" autocomplete="new-password" minlength="8" required>
  </label>
  <div class="row">
    <button class="btn primary" type="submit">Update password</button>
    <a class="btn" href="{{ url_for('dashboard') }}">Cancel</a>
  </div>
</form>
{% endblock %}
